name: Bug report
description: Report a defect in Stagehand
title: "bug: <short summary>"
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please complete every field below so
        we can reproduce the problem quickly. For suspected security issues, use the
        security advisory flow described in `SECURITY.md` instead of this form.

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` and paste the version and build (e.g. `Windows 11 Pro 23H2, build 22631.3737`).
      placeholder: Windows 11 Pro 23H2, build 22631.xxxx
    validations:
      required: true

  - type: input
    id: stagehand-version
    attributes:
      label: Stagehand version
      description: Visible in the tray menu "About" entry, or on the Settings window footer.
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Numbered steps that reliably trigger the bug from a fresh launch.
      placeholder: |
        1. Launch Stagehand from the Start menu.
        2. Right-click the tray icon and choose "Enable stage".
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs actual behaviour
      description: What did you expect to happen? What happened instead?
      placeholder: |
        Expected: the active window docks to the right monitor.
        Actual: Stagehand throws a Win32InteropException and the sidebar disappears.
    validations:
      required: true

  - type: textarea
    id: log-excerpt
    attributes:
      label: Log excerpt
      description: |
        Paste the relevant portion of the log file from `%LOCALAPPDATA%\Stagehand\logs\`.
        Include the ten lines before the failure. Redact any personal paths if needed.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Monitor layout, DPI, locale, recently installed software, anything you suspect is relevant.
    validations:
      required: false
