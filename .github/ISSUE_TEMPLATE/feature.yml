name: Feature request
description: Propose an enhancement or new capability for Stagehand
title: "feat: <short summary>"
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search existing issues (open and closed) to confirm this
        idea has not been discussed. Stagehand keeps a deliberately tight scope; not
        every idea will be accepted, but well-framed proposals are always appreciated.

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem statement
      description: What user problem or workflow gap does this address? Avoid jumping to a solution.
      placeholder: |
        When I have six windows on a single monitor, the sidebar thumbnails become too small to
        distinguish apps at a glance...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe what you would like Stagehand to do. Mock-ups or ASCII sketches welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why the proposed one is preferable.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Willingness to contribute
      description: Are you open to helping ship this?
      options:
        - "Yes — I would like to submit the PR myself"
        - "Yes — I can help with testing, docs, or review"
        - "No — I am only filing the request"
    validations:
      required: true
